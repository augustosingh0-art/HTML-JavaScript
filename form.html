<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de ejemplo</title>
</head>
<body>
    <h1>Formulario</h1>
    <h3>Ejemplo de formulario</h3>
    <form action="">
        <input type="text">
        <br>
        <input type="password">
        <br>
        <input type="number">
        <br>
        <input type="email">
        <br>
        <input type="date">
        <br>
        <input type="time">
        <br> 
        <input type="range" min="1" max="10">
        <br>
        <input type="color">
        <br> 
        <input type="button" value="boton">
        <br>
        <input type="submit">
        <br>
        <input type="text" required="">
    </form>
</body>
</html>
